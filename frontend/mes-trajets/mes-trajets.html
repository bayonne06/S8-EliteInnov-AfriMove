<body id="page-mes-trajets">

      <a class="brand" href="../accueil/index.html">BraCovoit</a>

      <ul class="navigation-liens">
        <li> <li><a href="../accueil/index.html">Accueil</a></li></li>

  <!-- NE PAS MODIFIER l'id — main.js y affiche l'état de connexion -->
       <div id="nav-session"></div>
    </nav>

  <main>
    <!-- =====================================================================
         RECHERCHE PAR NUMÉRO — TODO (Dev FS5)
         Mettre en forme le bloc de saisie du numéro de téléphone, le
         bouton de chargement et le filtre de statut. Layout en ligne sur
         desktop, empilé sur mobile.

         *** NE PAS MODIFIER les id ci-dessous — main.js les utilise ***
         ===================================================================== -->
        
    <section class="barre-recherche-tel" aria-labelledby="titre-recherche">
  <div class="recherche-intro">
    <p class="sur-titre">Historique passager</p>
    <h2 id="titre-recherche">Retrouver mes trajets</h2>
    <p>Entre ton numéro pour consulter tes réservations.</p>
  </div>

  <div class="recherche-champs">
    <div class="champ-telephone">
      <label for="mt-tel">Numéro de téléphone</label>
      <input
        type="tel"
        id="mt-tel"
        inputmode="tel"
        autocomplete="tel"
        placeholder="Ex. 06 123 45 67"
      >
    </div>

    <button id="btn-charger-mestrajets" type="button">
      Voir mes trajets
    </button>

    <div class="champ-filtre">
      <label for="mt-filtre-statut">Filtrer par statut</label>
      <select id="mt-filtre-statut">
        <option value="">Tous les statuts</option>
        <option value="effectue">Effectués</option>
        <option value="en_attente">En attente</option>
        <option value="annule">Annulés</option>
      </select>
    </div>
  </div>
</section>

    <!-- TOTAL DÉPENSÉ — TODO (Dev FS5) : mettre en avant ce chiffre
         visuellement (encart ou bandeau).
         *** NE PAS MODIFIER l'id *** -->
    <p class="total-depense">Total dépensé : <strong id="mt-total">0 FCFA</strong></p>
    
    <!-- =====================================================================
         LISTE DES RÉSERVATIONS — TODO (Dev FS5)
         main.js remplit ce conteneur avec des cartes .carte-reservation,
         chacune avec un <h3>, des <p> (date, conducteur, prix), et un
         <span class="statut statut-effectue|statut-en_attente|statut-annule">.
         Prévoyez une couleur distincte par statut. Layout en liste verticale
         ou grille selon votre choix.

         *** NE PAS MODIFIER l'id ***
         ===================================================================== -->
    <section aria-label="Liste de mes réservations" >
      <div id="mt-liste"></div>
    </section>
  </main>

  <div id="erreur-globale" hidden></div>

  <script src="../functions.js"></script>
  <script src="../main.js"></script>
</body>
</html>
