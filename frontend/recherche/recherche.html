<body id="page-recherche">

  <!-- NAVIGATION — TODO (Dev FS2) -->
  <header class="site-header">
    <div class="nav-barre">
      <a class="nav-marque" href="../accueil/index.html">BraCovoit</a>

      <nav class="nav-principale" id="nav-principale" aria-label="Navigation principale">
        <ul class="nav-liens" id="nav-liens">
          <li><a href="../accueil/index.html">Accueil</a></li>
          <li><a href="recherche.html" aria-current="page">Recherche</a></li>
          <li><a href="../proposer/proposer.html">Proposer un trajet</a></li>
          <li><a href="../mes-trajets/mes-trajets.html">Mes trajets</a></li>
        </ul>

        <!-- NE PAS MODIFIER l'id — main.js y affiche l'état de connexion -->
        <div id="nav-session"></div>
      </nav>

      <button
        type="button"
        class="nav-burger"
        id="nav-burger"
        aria-label="Ouvrir le menu"
        aria-expanded="false"
        aria-controls="nav-principale"
      >
        <span class="nav-burger-lignes" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </span>
      </button>
    </div>

    <div class="nav-overlay" id="nav-overlay" hidden></div>
  </header>

  <main>
    <header class="page-intro">
      <h1>Trouver un trajet</h1>
      <p>Filtrez par quartier de départ ou cherchez un mot-clé parmi les trajets disponibles.</p>
    </header>

    <!-- =====================================================================
         FILTRES — TODO (Dev FS2)
         Mettre en forme la barre de filtres : sélecteur de quartier de
         départ, champ de recherche libre, bouton de lancement. Layout en
         ligne sur desktop, empilé sur mobile.

         *** NE PAS MODIFIER les id ci-dessous — main.js les utilise ***
         ===================================================================== -->
    <section class="barre-filtres" aria-label="Filtres de recherche">
      <div class="filtre-champ">
        <span class="filtre-label" id="label-filtre-depart">Départ</span>
        <div class="select-custom">
          <select id="filtre-depart" class="select-natif" aria-labelledby="label-filtre-depart"></select>
          <button
            type="button"
            class="select-trigger"
            id="filtre-depart-trigger"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-labelledby="label-filtre-depart"
          >
            <span class="select-trigger-texte">Tous les quartiers</span>
          </button>
          <ul class="select-liste" id="filtre-depart-liste" role="listbox" hidden></ul>
        </div>
      </div>

      <label class="filtre-champ filtre-recherche" for="champ-recherche">
        <span class="filtre-label">Mot-clé</span>
        <span class="champ-recherche-wrap">
          <svg class="icone-loupe" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M20 20l-3.5-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <input type="text" id="champ-recherche" placeholder="Rechercher un quartier, un mot-clé...">
        </span>
      </label>

      <button type="button" id="btn-rechercher">Rechercher</button>
    </section>

    <!-- =====================================================================
         RÉSULTATS — TODO (Dev FS2)
         main.js remplit ce conteneur avec des cartes .carte-trajet, chacune
         contenant un <h3>, un <p class="heure">, un <p class="conducteur">,
         un <p class="prix">, un <span class="badge badge-dispo|badge-limite|
         badge-complet">, et un lien <a class="btn-voir">. Stylez ces
         éléments (déjà présents dans le HTML généré par main.js — vous ne
         les créez pas ici, vous écrivez le CSS qui les habille).
         Layout : grille responsive (1 colonne mobile, 2-3 colonnes desktop).
         Gérez aussi l'état "aucun résultat" (classe .aucun-resultat).

         *** NE PAS MODIFIER l'id ci-dessous ***
         ===================================================================== -->
    <section id="liste-trajets" aria-live="polite" aria-label="Résultats de recherche"></section>
  </main>

  <div id="erreur-globale" hidden></div>

  <!-- NE PAS MODIFIER -->
  <script src="../functions.js"></script>
  <script src="../main.js"></script>
  <script>
    (function () {
      /* ---- Menu burger ---- */
      var burger = document.getElementById("nav-burger");
      var nav = document.getElementById("nav-principale");
      var overlay = document.getElementById("nav-overlay");

      function fermerMenu() {
        document.body.classList.remove("menu-ouvert");
        if (burger) {
          burger.setAttribute("aria-expanded", "false");
          burger.setAttribute("aria-label", "Ouvrir le menu");
        }
        if (overlay) overlay.hidden = true;
      }

      function ouvrirMenu() {
        document.body.classList.add("menu-ouvert");
        if (burger) {
          burger.setAttribute("aria-expanded", "true");
          burger.setAttribute("aria-label", "Fermer le menu");
        }
        if (overlay) overlay.hidden = false;
      }

      if (burger && nav && overlay) {
        burger.addEventListener("click", function () {
          if (document.body.classList.contains("menu-ouvert")) fermerMenu();
          else ouvrirMenu();
        });
        overlay.addEventListener("click", fermerMenu);
        nav.addEventListener("click", function (e) {
          if (e.target.closest("a")) fermerMenu();
        });
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") {
            fermerMenu();
            fermerSelect();
          }
        });
        window.addEventListener("resize", function () {
          if (window.matchMedia("(min-width: 960px)").matches) fermerMenu();
        });
      }

      /* ---- Select Départ : liste toujours vers le bas ---- */
      var select = document.getElementById("filtre-depart");
      var trigger = document.getElementById("filtre-depart-trigger");
      var liste = document.getElementById("filtre-depart-liste");
      var triggerTexte = trigger ? trigger.querySelector(".select-trigger-texte") : null;

      function fermerSelect() {
        if (!liste || !trigger) return;
        liste.hidden = true;
        trigger.setAttribute("aria-expanded", "false");
        trigger.classList.remove("est-ouvert");
      }

      function ouvrirSelect() {
        if (!liste || !trigger) return;
        liste.hidden = false;
        trigger.setAttribute("aria-expanded", "true");
        trigger.classList.add("est-ouvert");
      }

      function synchroniserListe() {
        if (!select || !liste || !triggerTexte) return;
        var options = Array.prototype.slice.call(select.options);
        liste.innerHTML = "";
        options.forEach(function (opt) {
          var li = document.createElement("li");
          li.setAttribute("role", "option");
          li.dataset.value = opt.value;
          li.textContent = opt.textContent;
          if (opt.selected) {
            li.setAttribute("aria-selected", "true");
            triggerTexte.textContent = opt.textContent;
          }
          li.addEventListener("click", function () {
            select.value = opt.value;
            select.dispatchEvent(new Event("change", { bubbles: true }));
            triggerTexte.textContent = opt.textContent;
            liste.querySelectorAll('[role="option"]').forEach(function (el) {
              el.removeAttribute("aria-selected");
            });
            li.setAttribute("aria-selected", "true");
            fermerSelect();
          });
          liste.appendChild(li);
        });
      }

      if (select && trigger && liste) {
        trigger.addEventListener("click", function (e) {
          e.preventDefault();
          if (liste.hidden) ouvrirSelect();
          else fermerSelect();
        });
        document.addEventListener("click", function (e) {
          if (!e.target.closest(".select-custom")) fermerSelect();
        });
        var observer = new MutationObserver(synchroniserListe);
        observer.observe(select, { childList: true });
        synchroniserListe();
      }
    })();
  </script>
</body>
</html>
