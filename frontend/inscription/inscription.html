<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AfriMove — Inscription</title>
  <link rel="stylesheet" href="inscription.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body id="page-inscription">

  <!-- NAVIGATION — TODO (Dev FS7) -->

  <!-- NE PAS MODIFIER l'id — main.js y affiche l'état de connexion -->
  
  <main>
    <!-- =====================================================================
         FORMULAIRE — TODO (Dev FS7)
         Mettre en forme le formulaire d'inscription : nom, téléphone,
         mot de passe. Prévoir un layout clair en colonne, avec des labels
         visibles pour chaque champ.

         *** NE PAS MODIFIER les id ci-dessous — main.js les utilise ***
         ===================================================================== -->
    <section class="auth-section" aria-labelledby="titre-inscription">
        <div class="auth-container">
          <header class="page-title">
            <h1 id="titre-inscription">Rejoignez AfriMove dès aujourd'hui !</h1>
            <div class="features">
              <div class="feature-item">
                <i class="fa-solid fa-circle-check"></i>
                <span>Trouvez un trajet en quelques secondes</span>
              </div>

              <div class="feature-item">
                <i class="fa-solid fa-circle-check"></i>
                <span>Partagez vos frais de transport</span>
              </div>

              <div class="feature-item">
                <i class="fa-solid fa-circle-check"></i>
                <span>Voyagez sereinement entre les quartiers de <br>Brazzaville</span>
              </div>
            </div>

            <p class="para">Inscrivez-vous ou Connectez-vous pour réserver ou proposer des trajets entre les quartiers de Brazzaville.</p>
            
            <div id="nav-session" class="auth-links"></div>
            
          </header> 
        </div>
    



      <form id="form-inscription" class="auth-form">
        
        <h2 class="form-txt">Créer un compte AfriMove</h2>
        
        <div class="form-group">
          <label for="i-nom">Nom complet</label>
          <input 
            type="text" 
            id="i-nom" 
            name="nom" 
            placeholder="Ex : Marie Mayéla" 
            autocomplete="name" 
            required>
        </div>
      
        <div class="form-group">
          <label for="i-telephone">Téléphone</label>
          <input 
            type="tel" 
            id="i-telephone"
            name="telephone" 
            placeholder="066123456"
            autocomplete="tel"
            required>
        </div>  
      
        <div class="form-group">
          <label for="i-mot-de-passe">Mot de passe</label>
          <input 
            type="password" 
            id="i-mot-de-passe"
            name="mot_de_passe"
            minlength="4"
            required>
        </div>

      

        <button type="submit" class="bttn">Créer mon compte</button>
      </form>
    </section>
    <!-- Zone d'erreurs de validation — TODO (Dev FS7) : mettre en forme la
         liste <ul><li> injectée par main.js en cas de formulaire invalide.
         NE PAS MODIFIER l'id. -->
    <div id="erreurs-form" hidden></div>

    <!-- LIEN VERS LOGIN — TODO (Dev FS7) : lien "Déjà un compte ? Se connecter"
         pointant vers ../login/login.html -->
  </main>

  <div 
    id="erreur-globale" hidden
    class="erreurs"></div>

  <script src="../functions.js"></script>
  <script src="../main.js"></script>
</body>
</html>
